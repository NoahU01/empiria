<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Schneekugel – empiria</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<style>
/* ===== Xmas 3 · "Die Schneekugel" ============================================
   Bewusste Abweichung von Schwarz-Gelb: das Blau #063755 aus dem Manual als
   Nachthimmel, Gelb bleibt der Akzent. Der CD-Kreis wird zur Kugel, die
   Leistungen liegen als Ring darum. Schuetteln per Klick. */
.sk { --blau: #063755; --blau-2: #04263b;
      position: relative; height: 100svh; overflow: hidden; color: #fff;
      background: radial-gradient(120% 90% at 50% 8%, #0a4a6f 0%, var(--blau) 45%, var(--blau-2) 100%);
      display: flex; flex-direction: column; }
.sk a { border-bottom: 0; }
.sk-sterne { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 78% 12%, #fff 50%, transparent 51%),
    radial-gradient(1.8px 1.8px at 34% 32%, #fff 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 88% 44%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 62% 8%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 22% 62%, #fff 50%, transparent 51%);
  background-size: 100% 100%; }

.sk-kopf { position: relative; z-index: 4; padding: clamp(22px,3.4vw,40px) var(--pad-x) 0;
           display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.sk-kopf img { height: 26px; }
.sk-jahr { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.5); }

.sk-raum { position: relative; z-index: 2; flex: 1 1 auto; display: grid; place-items: center;
           padding: clamp(16px,2.4vw,32px) var(--pad-x) clamp(24px,3.4vw,44px); }
.sk-ring { position: relative; width: min(84vmin, 720px); aspect-ratio: 1; display: grid; place-items: center; }

/* ---- Die Kugel ---------------------------------------------------------- */
.sk-kugel { position: relative; width: 54%; aspect-ratio: 1; border-radius: 50%;
            background: radial-gradient(120% 120% at 32% 24%, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 40%, rgba(255,255,255,.03) 70%);
            border: 2px solid rgba(255,255,255,.4); overflow: hidden;
            display: grid; place-items: center; text-align: center;
            box-shadow: 0 30px 70px rgba(0,0,0,.4), inset 0 -24px 50px rgba(0,0,0,.28);
            cursor: pointer; }
.sk-kugel:focus-visible { outline: 3px solid var(--hl); outline-offset: 6px; }
.sk-kugel.is-shake { animation: sk-shake .7s cubic-bezier(.36,.07,.19,.97); }
@keyframes sk-shake {
  10%,90% { transform: translateX(-3px) rotate(-.6deg); }
  30%,70% { transform: translateX(5px) rotate(.9deg); }
  50% { transform: translateX(-6px) rotate(-1.1deg); } }
.sk-flocken { position: absolute; inset: -30% 0 0; pointer-events: none; }
.sk-flocken i { position: absolute; inset: 0;
  background-image:
    radial-gradient(2px 2px at 24% 14%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 68% 36%, #fff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 44% 64%, #fff 50%, transparent 51%),
    radial-gradient(2px 2px at 84% 80%, #fff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 14% 88%, #fff 50%, transparent 51%);
  background-size: 160px 160px; animation: sk-fall 9s linear infinite; opacity: .85; }
.sk-flocken i:nth-child(2) { background-size: 110px 110px; animation-duration: 14s; opacity: .55; }
.sk-kugel.is-shake .sk-flocken i { animation-duration: 1.6s; }
@keyframes sk-fall { to { transform: translateY(160px); } }
.sk-inhalt { position: relative; z-index: 2; padding: 0 12%; }
.sk-stern { width: 34px; height: 34px; color: var(--hl); margin: 0 auto .8rem; display: block; }
.sk-h1 { font-family: var(--font-serif); font-weight: 500; line-height: 1.08;
         font-size: clamp(1.5rem,3.4vmin,2.6rem); margin: 0 0 .7rem; color: #fff; }
.sk-h1 em { font-style: normal; color: var(--hl); }
.sk-wunsch { font-size: clamp(.78rem,1.5vmin,.98rem); line-height: 1.6; font-weight: 300;
             color: rgba(255,255,255,.8); margin: 0; }
.sk-tipp { margin-top: .9rem; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
           color: rgba(255,255,255,.42); }
.sk-boden { position: absolute; left: 12%; right: 12%; bottom: -14px; height: 26px;
            border-radius: 6px; background: linear-gradient(#123f5c, #0a2b41);
            border: 2px solid rgba(255,255,255,.28); }

/* ---- Der Ring aus Leistungen -------------------------------------------- */
.sk-punkt { position: absolute; left: 50%; top: 50%; width: max-content;
            transform: rotate(var(--a)) translate(min(38vmin,326px)) rotate(calc(-1 * var(--a)));
            transform-origin: 0 0; }
.sk-chip { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap;
           transform: translate(-50%,-50%);
           padding: 9px 16px; border-radius: 999px; text-decoration: none;
           background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.26);
           color: rgba(255,255,255,.88); font-size: .86rem; font-weight: 500;
           backdrop-filter: blur(4px);
           transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease; }
.sk-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
                   background: var(--hl); flex: 0 0 auto; transition: transform .2s ease; }
.sk-chip:hover, .sk-chip:focus-visible { background: var(--hl); color: #06283d;
           border-color: var(--hl); transform: translate(-50%,-50%) scale(1.07); }
.sk-chip:hover::before, .sk-chip:focus-visible::before { background: #06283d; transform: scale(1.4); }

@media (max-width: 760px) {
  .sk-ring { width: 100%; aspect-ratio: auto; display: block; }
  .sk-kugel { width: min(76vw, 340px); margin: 0 auto clamp(26px,6vw,40px); }
  .sk-punkt { position: static; transform: none; width: auto; }
  .sk-chip { transform: none; }
  .sk-chip:hover, .sk-chip:focus-visible { transform: scale(1.03); }
  .sk-liste { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
}
@media (min-width: 761px) { .sk-liste { display: contents; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-stern" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 2.6v18.8M2.6 12h18.8M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7"/></symbol>
</defs></svg>

<main class="sk">
  <div class="sk-sterne" aria-hidden="true"></div>

  <header class="sk-kopf">
    <img src="/assets/empiria-logo-white.svg" alt="empiria">
    <span class="sk-jahr">Weihnachten 2026</span>
  </header>

  <div class="sk-raum">
    <div class="sk-ring">

      <div class="sk-kugel" id="kugel" role="button" tabindex="0" aria-label="Schneekugel schütteln">
        <div class="sk-flocken" aria-hidden="true"><i></i><i></i></div>
        <div class="sk-inhalt">
          <svg class="sk-stern" aria-hidden="true"><use href="#ic-stern"/></svg>
          <h1 class="sk-h1">Frohe<br><em>Weihnachten.</em></h1>
          <p class="sk-wunsch">Danke für ein Jahr mit klaren Fragen und ehrlichen Antworten.
            Wir wünschen Dir ruhige Tage und einen richtig guten Start in 2027.</p>
          <p class="sk-tipp">Klick mich · ich schüttle mich</p>
        </div>
        <span class="sk-boden" aria-hidden="true"></span>
      </div>

      <nav class="sk-liste" aria-label="Unsere Leistungen">
        <span class="sk-punkt" style="--a:-96deg"><a class="sk-chip" href="/leistungen/strategie">Strategie in den Alltag</a></span>
        <span class="sk-punkt" style="--a:-36deg"><a class="sk-chip" href="/workshops">Workshops</a></span>
        <span class="sk-punkt" style="--a:24deg"><a class="sk-chip" href="/marketing">Marketing 2.0</a></span>
        <span class="sk-punkt" style="--a:84deg"><a class="sk-chip" href="/training-sparring">Training &amp; Sparring</a></span>
        <span class="sk-punkt" style="--a:144deg"><a class="sk-chip" href="/dashboard-digitales-marketing">MarketingEcoSystem</a></span>
        <span class="sk-punkt" style="--a:204deg"><a class="sk-chip" href="/leistungen/innovation">Innovation</a></span>
      </nav>

    </div>
  </div>
</main>

<script>
(function(){
  var k = document.getElementById('kugel');
  function schuetteln(){
    k.classList.remove('is-shake');
    void k.offsetWidth;                 // Neustart der Animation erzwingen
    k.classList.add('is-shake');
  }
  k.addEventListener('click', schuetteln);
  k.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); schuetteln(); }
  });
  setTimeout(schuetteln, 700);          // einmal von selbst, damit man es sieht
})();
</script>

</body>
</html>
