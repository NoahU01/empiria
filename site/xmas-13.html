<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gute Vorsätze 2027 · Die Jahreszahlen – empiria</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/assets/lead/lead.css">
<style>
/* ===== Xmas 13 · "Die Jahreszahlen" ==========================================
   Keine Liste, sondern Typografie: 2025 und 2026 stehen gross und sind
   durchgestrichen, 2027 leuchtet gelb. Der Strich wird beim Laden gezogen -
   man sieht also zu, wie die beiden Jahre gestrichen werden. Daneben die
   Vorsaetze als Kacheln; ein Klick oeffnet den Lead-Dialog. */
.jz { position: relative; height: 100svh; overflow: hidden; background: var(--black);
      color: #fff; display: flex; flex-direction: column; }
.jz a { border-bottom: 0; }
.jz-wm { position: fixed; color: #151515; width: 60vmin; height: 60vmin;
         left: -18vmin; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 0; }

.jz-kopf { position: relative; z-index: 3; padding: clamp(18px,2.6vw,32px) var(--pad-x) 0;
           display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.jz-kopf img { height: 26px; }
.jz-jahr { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--grey-50); }

.jz-raum { position: relative; z-index: 3; flex: 1 1 auto; display: grid;
           grid-template-columns: minmax(0,.92fr) minmax(0,1.08fr);
           align-items: center; gap: clamp(26px,4vw,64px);
           padding: clamp(14px,2.2vh,28px) var(--pad-x) clamp(18px,3vh,40px); }

/* ---- Die Jahreszahlen --------------------------------------------------- */
.jahre { display: flex; flex-direction: column; gap: clamp(2px,.6vh,8px);
         margin-bottom: clamp(16px,2.6vh,30px); }
.jahr { position: relative; font-family: var(--font-serif); font-weight: 700; line-height: .96;
        font-size: clamp(3rem,8.5vw,6.4rem); letter-spacing: -.02em; width: fit-content; }
.jahr--alt { color: #3a3a3a; }
/* Der Strich waechst beim Laden von links nach rechts */
.jahr--alt::after { content: ""; position: absolute; left: -3%; right: -3%; top: 50%;
                    height: clamp(5px,.9vw,9px); background: var(--hl); border-radius: 3px;
                    transform: scaleX(0) rotate(-1.6deg); transform-origin: left center;
                    animation: jz-strich .7s cubic-bezier(.2,.8,.3,1) forwards; }
.jahr--alt:nth-child(1)::after { animation-delay: .5s; }
.jahr--alt:nth-child(2)::after { animation-delay: 1.05s; transform: scaleX(0) rotate(1.3deg); }
@keyframes jz-strich { to { transform: scaleX(1) rotate(-1.6deg); } }
.jahr--alt:nth-child(2)::after { animation-name: jz-strich2; }
@keyframes jz-strich2 { to { transform: scaleX(1) rotate(1.3deg); } }
.jahr--neu { color: var(--ink); }
.jahr--neu::before { content: ""; position: absolute; left: -4%; right: -4%; top: 6%; bottom: 8%;
                     background: var(--hl); z-index: -1; border-radius: 6px;
                     transform: scaleX(0); transform-origin: left center;
                     animation: jz-fuell .6s cubic-bezier(.2,.8,.3,1) 1.65s forwards; }
@keyframes jz-fuell { to { transform: scaleX(1); } }

.jz-kicker { font-size: .82rem; letter-spacing: .16em; text-transform: uppercase;
             color: var(--hl); font-weight: 500; margin: 0 0 .7rem; }
.jz-h2 { font-family: var(--font-serif); font-weight: 500; line-height: 1.16;
         font-size: clamp(1.1rem,1.9vw,1.55rem); margin: 0 0 .8rem; color: #fff; }
.jz-lead { font-size: clamp(.9rem,1.1vw,1.02rem); line-height: 1.64; font-weight: 300;
           color: rgba(255,255,255,.72); margin: 0; max-width: 40ch; }
.jz-lead b { color: #fff; font-weight: 600; }

/* ---- Die Vorsaetze als Kacheln ------------------------------------------ */
.kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(9px,1.1vw,14px); }
.kachel { position: relative; text-align: left; background: rgba(255,255,255,.04);
          border: 1px solid rgba(255,255,255,.15); border-radius: 16px; cursor: pointer;
          font: inherit; color: #fff; padding: clamp(13px,1.5vw,19px);
          display: flex; flex-direction: column; gap: 6px;
          transition: background .2s ease, border-color .2s ease, transform .2s ease; }
.kachel:hover, .kachel:focus-visible { background: rgba(255,244,0,.09); border-color: var(--hl);
          transform: translateY(-4px); }
.kachel-nr { font-family: var(--font-serif); font-weight: 700; font-size: .76rem;
             color: var(--hl); letter-spacing: .08em; }
.kachel b { font-family: var(--font-serif); font-weight: 700; line-height: 1.24;
            font-size: clamp(.9rem,1.15vw,1.02rem); }
.kachel small { font-size: .76rem; line-height: 1.45; color: rgba(255,255,255,.58);
                font-weight: 300; }
.kachel-pdf { margin-top: auto; padding-top: 6px; font-size: .66rem; letter-spacing: .12em;
              text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,.35);
              transition: color .2s ease; }
.kachel:hover .kachel-pdf, .kachel:focus-visible .kachel-pdf { color: var(--hl); }

@media (max-width: 1000px) {
  .jz-raum { grid-template-columns: 1fr; align-content: center; gap: 18px; }
  .jahre { flex-direction: row; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .jahr { font-size: clamp(2rem,7vw,3.2rem); }
  .jz-lead { display: none; }
}
@media (max-height: 800px) { .kachel small { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .jahr--alt::after { animation: none; transform: scaleX(1) rotate(-1.6deg); }
  .jahr--neu::before { animation: none; transform: scaleX(1); }
}
</style>
</head>
<body>

<main class="jz">

        data-bild="/assets/downloads/empiria-dashboard-digitales-marketing-1.webp">
        <span class="kachel-nr">05</span>
        <b>Endlich sehen, was das Marketing bringt.</b>

      <button class="kachel" type="button"
        data-kicker="Dein Vorsatz für 2027" data-lead="1:1 Sparring"

        data-bild="/assets/downloads/empiria-sparring-1.webp">

</main>
